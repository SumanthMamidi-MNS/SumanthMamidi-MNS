<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" height="100%">
  <defs>
    <!-- Tokyo Night Obsidian Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="35%" stop-color="#0c101d" />
      <stop offset="70%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <!-- Ambient Core Atmosphere -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="center-protection" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#0c101d" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#0c101d" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#0c101d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="left-glow" cx="12%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="right-glow" cx="88%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f4fc" />
      <stop offset="100%" stop-color="#bac7f5" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#1f273d" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#1f273d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="top-stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#7aa2f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7aa2f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="bot-stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#7dcfff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7dcfff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="line-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neon-node" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Matrix Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.75" fill="#7aa2f7" fill-opacity="0.18" />
    </pattern>

    <style>
      @keyframes floatPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.95; }
      }

      @keyframes streamTravelFast {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes streamTravelSlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1200; }
      }

      @keyframes beaconBlink {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.25); }
      }

      .stream-fast {
        stroke-dasharray: 140 400;
        animation: streamTravelFast 5.5s linear infinite;
      }

      .stream-slow {
        stroke-dasharray: 120 360;
        animation: streamTravelSlow 7s linear infinite;
      }

      .beacon {
        transform-box: fill-box;
        transform-origin: center;
        animation: beaconBlink 2.2s ease-in-out infinite;
      }

      .pulse-1 { animation: floatPulse 3s ease-in-out infinite; }
      .pulse-2 { animation: floatPulse 3.8s ease-in-out infinite 0.7s; }
      .pulse-3 { animation: floatPulse 2.6s ease-in-out infinite 1.4s; }
      .pulse-4 { animation: floatPulse 4.2s ease-in-out infinite 2.1s; }
    </style>
  </defs>

  <!-- Precision Curved Container -->
  <clipPath id="card-clip">
    <rect x="0" y="0" width="1280" height="320" rx="24" ry="24" />
  </clipPath>

  <g clip-path="url(#card-clip)">
    <!-- Base Canvas -->
    <rect x="0" y="0" width="1280" height="320" fill="url(#bg-grad)" />

    <!-- Ambient Glows -->
    <rect x="0" y="0" width="1280" height="320" fill="url(#left-glow)" />
    <rect x="0" y="0" width="1280" height="320" fill="url(#right-glow)" />
    <rect x="0" y="0" width="1280" height="320" fill="url(#center-glow)" />

    <!-- Cyber Grid Points -->
    <rect x="0" y="0" width="1280" height="320" fill="url(#cyber-grid)" />

    <!-- Technical Crosshairs & Corner Guides -->
    <g opacity="0.38" stroke="#7aa2f7" stroke-width="1">
      <path d="M 36 26 L 44 26 M 40 22 L 40 30" />
      <path d="M 1236 26 L 1244 26 M 1240 22 L 1240 30" />
      <path d="M 36 294 L 44 294 M 40 290 L 40 298" />
      <path d="M 1236 294 L 1244 294 M 1240 290 L 1240 298" />
      <!-- Framing Guides -->
      <path d="M 52 22 L 22 22 L 22 52" fill="none" stroke="#7aa2f7" stroke-width="1.2" opacity="0.35" />
      <path d="M 1228 22 L 1258 22 L 1258 52" fill="none" stroke="#7aa2f7" stroke-width="1.2" opacity="0.35" />
      <path d="M 52 298 L 22 298 L 22 268" fill="none" stroke="#7aa2f7" stroke-width="1.2" opacity="0.35" />
      <path d="M 1228 298 L 1258 298 L 1258 268" fill="none" stroke="#7aa2f7" stroke-width="1.2" opacity="0.35" />
    </g>

    <!-- Technical Telemetry Monospace -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#565f89" letter-spacing="1.5">
      <text x="56" y="30">SYS_ARCH::DISTRIBUTED_AI</text>
      <text x="1224" y="30" text-anchor="end">INFERENCE::LOW_LATENCY</text>
      <text x="56" y="296">TENSOR_CORE::ACTIVE</text>
      <text x="1224" y="296" text-anchor="end">MODEL::OPTIMIZED_v2.5</text>
    </g>

    <!-- ==================== FLOWING AI ATTENTION STREAMLINES ==================== -->
    <!-- Upper Streamline: Arches elegantly ABOVE the pill badge -->
    <g>
      <!-- Base Upper Path -->
      <path d="M -80 65 C 180 85, 380 24, 640 20 C 900 16, 1100 80, 1360 45" 
            fill="none" stroke="url(#top-stream-grad)" stroke-width="1.6" opacity="0.45" />
      <!-- High-speed animated attention packet -->
      <path class="stream-fast" d="M -80 65 C 180 85, 380 24, 640 20 C 900 16, 1100 80, 1360 45" 
            fill="none" stroke="#7dcfff" stroke-width="2.8" filter="url(#soft-glow)" opacity="0.85" />
    </g>

    <!-- Lower Streamline: Undulates smoothly BELOW the central separator -->
    <g>
      <!-- Base Lower Path -->
      <path d="M -80 260 C 200 230, 420 288, 640 288 C 860 288, 1080 232, 1360 268" 
            fill="none" stroke="url(#bot-stream-grad)" stroke-width="1.6" opacity="0.45" />
      <!-- High-speed animated attention packet (reverse) -->
      <path class="stream-slow" d="M -80 260 C 200 230, 420 288, 640 288 C 860 288, 1080 232, 1360 268" 
            fill="none" stroke="#7aa2f7" stroke-width="2.8" filter="url(#soft-glow)" opacity="0.85" />
    </g>

    <!-- Central Contrast Protection (Guarantees 100% Crisp Legibility) -->
    <ellipse cx="640" cy="160" rx="430" ry="130" fill="url(#center-protection)" />

    <!-- ==================== LEFT NEURAL INPUT PIPELINE ==================== -->
    <g>
      <!-- Network Edges -->
      <line x1="85" y1="95" x2="155" y2="135" stroke="#7aa2f7" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
      <line x1="85" y1="215" x2="155" y2="175" stroke="#7aa2f7" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
      <line x1="155" y1="135" x2="155" y2="175" stroke="#7aa2f7" stroke-width="1" opacity="0.25" />
      <line x1="155" y1="135" x2="230" y2="155" stroke="#7dcfff" stroke-width="1.4" opacity="0.4" />
      <line x1="155" y1="175" x2="230" y2="155" stroke="#7dcfff" stroke-width="1.4" opacity="0.4" />
      <line x1="230" y1="155" x2="310" y2="155" stroke="#7aa2f7" stroke-width="1" opacity="0.25" stroke-dasharray="4 4" />

      <!-- Synaptic Nodes -->
      <circle cx="85" cy="95" r="3.5" fill="#7aa2f7" class="pulse-1" filter="url(#neon-node)" />
      <circle cx="85" cy="215" r="3.5" fill="#7aa2f7" class="pulse-3" filter="url(#neon-node)" />
      <circle cx="155" cy="135" r="4.5" fill="#7dcfff" class="pulse-2" filter="url(#neon-node)" />
      <circle cx="155" cy="175" r="4" fill="#7aa2f7" class="pulse-4" filter="url(#neon-node)" />
      <circle cx="230" cy="155" r="5.5" fill="#7dcfff" class="pulse-1" filter="url(#neon-node)" />
      <circle cx="230" cy="155" r="2.5" fill="#ffffff" />
      <circle cx="310" cy="155" r="2.5" fill="#7aa2f7" class="pulse-3" opacity="0.5" />

      <!-- Neural Layer Label -->
      <text x="85" y="75" font-family="ui-monospace, monospace" font-size="8.5" fill="#565f89" font-weight="600" letter-spacing="1">INPUT_LAYER</text>
      <text x="230" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#7aa2f7" font-weight="600" letter-spacing="1">LATENT_HUB</text>
    </g>

    <!-- ==================== RIGHT INFERENCE OUTPUT GRAPH ==================== -->
    <g>
      <!-- Network Edges -->
      <line x1="970" y1="155" x2="1050" y2="155" stroke="#7aa2f7" stroke-width="1" opacity="0.25" stroke-dasharray="4 4" />
      <line x1="1050" y1="155" x2="1125" y2="135" stroke="#7dcfff" stroke-width="1.4" opacity="0.4" />
      <line x1="1050" y1="155" x2="1125" y2="175" stroke="#7dcfff" stroke-width="1.4" opacity="0.4" />
      <line x1="1125" y1="135" x2="1125" y2="175" stroke="#7aa2f7" stroke-width="1" opacity="0.25" />
      <line x1="1125" y1="135" x2="1195" y2="95" stroke="#7aa2f7" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
      <line x1="1125" y1="175" x2="1195" y2="215" stroke="#7aa2f7" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />

      <!-- Synaptic Nodes -->
      <circle cx="970" cy="155" r="2.5" fill="#7aa2f7" class="pulse-2" opacity="0.5" />
      <circle cx="1050" cy="155" r="5.5" fill="#7dcfff" class="pulse-3" filter="url(#neon-node)" />
      <circle cx="1050" cy="155" r="2.5" fill="#ffffff" />
      <circle cx="1125" cy="135" r="4" fill="#7aa2f7" class="pulse-1" filter="url(#neon-node)" />
      <circle cx="1125" cy="175" r="4.5" fill="#7dcfff" class="pulse-4" filter="url(#neon-node)" />
      <circle cx="1195" cy="95" r="3.5" fill="#7aa2f7" class="pulse-2" filter="url(#neon-node)" />
      <circle cx="1195" cy="215" r="3.5" fill="#7dcfff" class="pulse-1" filter="url(#neon-node)" />

      <!-- Output Layer Label -->
      <text x="1050" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#7dcfff" font-weight="600" letter-spacing="1">INFERENCE</text>
      <text x="1195" y="75" text-anchor="end" font-family="ui-monospace, monospace" font-size="8.5" fill="#565f89" font-weight="600" letter-spacing="1">DEPLOYED_SYS</text>
    </g>

    <!-- ==================== EXECUTIVE TYPOGRAPHY CORE ==================== -->
    <g filter="url(#card-shadow)">
      
      <!-- Top Pill: ARTIFICIAL INTELLIGENCE & MACHINE LEARNING -->
      <!-- Width 440px gives generous, luxurious breathing room for the beacon dot and text -->
      <g transform="translate(640, 64)">
        <rect x="-220" y="-14" width="440" height="28" rx="14" ry="14" 
              fill="url(#pill-bg)" stroke="#7aa2f7" stroke-width="1.2" stroke-opacity="0.65" />
        <!-- Pulsing Active Beacon -->
        <circle cx="-195" cy="0" r="4" fill="#7dcfff" class="beacon" filter="url(#soft-glow)" />
        <circle cx="-195" cy="0" r="2" fill="#ffffff" />
        <!-- Pill Text: perfectly centered -->
        <text x="10" y="3.5" text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
              font-size="11" font-weight="700" fill="#7dcfff" letter-spacing="2.2">
          ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING
        </text>
      </g>

      <!-- Primary Title: SUMANTH MAMIDI -->
      <text x="640" y="146" text-anchor="middle" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="47" font-weight="800" fill="url(#title-grad)" letter-spacing="4.5">
        SUMANTH MAMIDI
      </text>

      <!-- Subtitle: Core Identity Focus -->
      <g transform="translate(640, 192)">
        <text text-anchor="middle" 
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
              font-size="16.5" font-weight="600" fill="#7aa2f7" letter-spacing="2">
          AI Systems Engineer <tspan fill="#565f89" font-weight="300"> • </tspan> Machine Learning <tspan fill="#565f89" font-weight="300"> • </tspan> Full-Stack Developer
        </text>
      </g>

      <!-- Technical Mission Line -->
      <g transform="translate(640, 226)">
        <text text-anchor="middle" 
              font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
              font-size="13" font-weight="400" fill="#a9b1d6" letter-spacing="1.6" opacity="0.95">
          Architecting Scalable AI Solutions &amp; High-Performance Intelligent Software
        </text>
      </g>

      <!-- Precision Tech Divider Line -->
      <g transform="translate(640, 246)">
        <line x1="-160" y1="0" x2="160" y2="0" stroke="url(#line-accent)" stroke-width="1.2" />
        <circle cx="0" cy="0" r="2.5" fill="#7dcfff" filter="url(#soft-glow)" />
      </g>

    </g>

  </g>

  <!-- Outer Protective Precision Bezel -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" ry="23.5" 
        fill="none" stroke="url(#border-grad)" stroke-width="1.2" />
</svg>