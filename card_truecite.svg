<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 136" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-tc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Side Light Radiant Gold Gradient -->
    <linearGradient id="side-light-tc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="left-glow-tc" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#eab308" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="shimmer-tc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>

    <!-- Exact TrueCite Official Logo Gradients -->
    <linearGradient id="tc-gold" x1="14" y1="6" x2="82" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="tc-text-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="tc-emerald" x1="34" y1="38" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <radialGradient id="tc-vector-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FACC15" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#CA8A04" stop-opacity="0.1"/>
      <stop offset="92%" stop-color="#CA8A04" stop-opacity="0"/>
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clip-tc">
      <rect x="2" y="2" width="936" height="132" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes shimmer-sweep {
      0% { transform: translateX(-400px) skewX(-20deg); }
      35% { transform: translateX(1200px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    .shimmer-layer {
      animation: shimmer-sweep 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    @keyframes tcGrowAndGlow {
      0%, 100% {
        opacity: 0.5;
        transform: scale(0.9);
      }
      50% {
        opacity: 1.0;
        transform: scale(1.18);
      }
    }
    .animated-aura {
      transform-origin: 48px 48px;
      animation: tcGrowAndGlow 2.6s ease-in-out infinite;
    }
    @keyframes tcPulseDot {
      0%, 100% { opacity: 0.5; transform: scale(0.85); }
      50% { opacity: 1.0; transform: scale(1.2); }
    }
    .tc-pulse-dot {
      transform-origin: 14px 14px;
      animation: tcPulseDot 2s ease-in-out infinite;
    }
    .tc-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 72px;
      letter-spacing: -0.8px;
    }
    .tc-true {
      font-weight: 600;
      fill: #FFFFFF;
    }
    .tc-cite {
      font-weight: 500;
      fill: url(#tc-text-gold);
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="2" y="2" width="936" height="132" rx="12" fill="url(#card-bg-tc)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="220" height="132" rx="12" fill="url(#left-glow-tc)" pointer-events="none"/>

  <!-- Left Side Lighting Bar (Variation 2 Signature Accent) -->
  <rect x="2" y="14" width="4.5" height="108" rx="2.25" fill="url(#side-light-tc)"/>

  <!-- Left Column: Exact Official Animated Logo + Domain Pill -->
  <g transform="translate(20, 16) scale(0.46)">
    <!-- Animated Aura -->
    <ellipse cx="48" cy="48" rx="58" ry="58" fill="url(#tc-vector-aura)" class="animated-aura"/>

    <!-- Dark-Core Shield with Radiant Gold Border -->
    <path d="M48 6 L82 22 V58 C82 78 48 90 48 90 C48 90 14 78 14 58 V22 Z"
          fill="#111827"
          stroke="url(#tc-gold)"
          stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Inner Subtle Border Highlight -->
    <path d="M48 9 L79 24 V57 C79 75 48 86 48 86 C48 86 17 75 17 57 V24 Z"
          fill="none"
          stroke="#FEF9C3"
          stroke-width="0.8"
          stroke-opacity="0.6"/>

    <!-- Claim Verification Checkmark (Vibrant Emerald) -->
    <path d="M34 50 L44 60 L64 38"
          fill="none"
          stroke="url(#tc-emerald)"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Wordmark "TrueCite" -->
    <text x="114" y="74" class="tc-wordmark">
      <tspan class="tc-true">True</tspan><tspan class="tc-cite">Cite</tspan>
    </text>
  </g>

  <!-- Domain Pill Underneath Logo (Mathematically Centered at x=129) -->
  <rect x="19" y="80" width="220" height="22" rx="5" fill="#121824" stroke="#253247" stroke-width="1"/>
  <text x="129" y="94.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#facc15" text-anchor="middle" letter-spacing="0.4">CITATION-VERIFIED RAG · AYURVEDA</text>

  <!-- Divider 1 -->
  <line x1="258" y1="18" x2="258" y2="118" stroke="#1c273c" stroke-width="1"/>

  <!-- Center Column: Centered Heading, Large Readable Typography & Telemetry -->
  <g transform="translate(278, 16)">
    <!-- Centered Larger Heading (Zero zoom required) -->
    <text x="218" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.2px">
      Citation-verified RAG engine for Ayurveda IP &amp; regulation
    </text>
    
    <!-- Centered Subtitle -->
    <text x="218" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Grounds every claim against verified texts · Zero hallucinated citations
    </text>

    <!-- Sleek Architectural Dataflow Pipeline (Enlarged & Generous Arrow Gaps) -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="436" height="34" rx="7" fill="#090e1a" stroke="#1c273c" stroke-width="1.2"/>
      
      <!-- Live Status Beacon -->
      <circle cx="16" cy="17" r="4" fill="#facc15" class="tc-pulse-dot"/>
      
      <!-- Pipeline Spec -->
      <text x="30" y="21.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">PIPELINE <tspan fill="#f8fafc" font-weight="700">Dense + BM25</tspan></text>
      
      <!-- Directional Chevron (Centered with generous 32px clearance) -->
      <text x="210" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="middle">──▶</text>
      
      <!-- Grounding Spec -->
      <text x="250" y="21.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">VERIFIER <tspan fill="#facc15" font-weight="700">100% Attribution</tspan></text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="728" y1="18" x2="728" y2="118" stroke="#1c273c" stroke-width="1"/>

  <!-- Right Column: Clean Tech Stack Matrix (Vertically Centered, No Redundant Button) -->
  <g transform="translate(746, 36)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="82" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="41" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Python</text>

    <rect x="90" y="0" width="86" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="133" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">FastAPI</text>

    <!-- Row 2 -->
    <rect x="0" y="34" width="82" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="41" y="50.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">PyTorch</text>

    <rect x="90" y="34" width="86" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="133" y="50.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">ChromaDB</text>
  </g>

  <!-- Luminous Shimmer Light Sweep -->
  <g clip-path="url(#clip-tc)" pointer-events="none">
    <rect class="shimmer-layer" x="0" y="0" width="220" height="136" fill="url(#shimmer-tc)"/>
  </g>
</svg>
