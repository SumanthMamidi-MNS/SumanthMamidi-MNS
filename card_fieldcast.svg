<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 136" width="100%">
  <defs>
    <!-- Background Gradient (Unified Dark Obsidian matching other cards) -->
    <linearGradient id="card-bg-fc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Side Light Pure Radiant Emerald Gradient (Zero Yellow) -->
    <linearGradient id="side-light-fc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ambient Left Glow (Subtle accent glow, zero green background wash) -->
    <radialGradient id="left-glow-fc" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="shimmer-fc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Luminous Emerald Arcs (Replaced blackish tones with vibrant emerald) -->
    <linearGradient id="fcOuterGrad" x1="8" y1="8" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="fcInnerGrad" x1="11" y1="11" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <radialGradient id="fcBeaconGrad" cx="38%" cy="32%" r="62%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <radialGradient id="fcBeaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clip-fc">
      <rect x="2" y="2" width="936" height="132" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes shimmer-sweep {
      0% { transform: translateX(-400px) skewX(-20deg); }
      35% { transform: translateX(1200px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    .shimmer-layer {
      animation: shimmer-sweep 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    @keyframes fcSonarWave1 {
      0% { opacity: 0; transform: scale(0.65); stroke-width: 3.2px; }
      15% { opacity: 1.0; stroke: #34D399; }
      65% { opacity: 0.45; stroke: #10B981; }
      100% { opacity: 0; transform: scale(2.1); stroke-width: 1.2px; }
    }
    @keyframes fcSonarWave2 {
      0%, 25% { opacity: 0; transform: scale(0.65); stroke-width: 3.0px; }
      40% { opacity: 0.95; stroke: #6EE7B7; }
      80% { opacity: 0.4; stroke: #059669; }
      100% { opacity: 0; transform: scale(2.1); stroke-width: 1.0px; }
    }
    @keyframes fcSonarWave3 {
      0%, 50% { opacity: 0; transform: scale(0.65); stroke-width: 2.8px; }
      65% { opacity: 0.9; stroke: #A7F3D0; }
      90% { opacity: 0.3; stroke: #047857; }
      100% { opacity: 0; transform: scale(2.1); stroke-width: 0.8px; }
    }
    @keyframes beaconGlowPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    .sonar-1 {
      transform-origin: 48px 48px;
      animation: fcSonarWave1 2.0s ease-out infinite;
    }
    .sonar-2 {
      transform-origin: 48px 48px;
      animation: fcSonarWave2 2.0s ease-out infinite;
    }
    .sonar-3 {
      transform-origin: 48px 48px;
      animation: fcSonarWave3 2.0s ease-out infinite;
    }
    .fc-beacon-glow {
      animation: beaconGlowPulse 2.2s ease-in-out infinite;
    }
    @keyframes fcPulseDot {
      0%, 100% { opacity: 0.5; transform: scale(0.85); }
      50% { opacity: 1.0; transform: scale(1.2); }
    }
    .fc-pulse-dot {
      transform-origin: 14px 14px;
      animation: fcPulseDot 2s ease-in-out infinite;
    }
    .fc-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 76px;
      letter-spacing: -1.2px;
    }
    .fc-field {
      font-weight: 600;
      fill: #FFFFFF;
    }
    .fc-cast {
      font-weight: 600;
      fill: #10B981;
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="2" y="2" width="936" height="132" rx="12" fill="url(#card-bg-fc)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="220" height="132" rx="12" fill="url(#left-glow-fc)" pointer-events="none"/>

  <!-- Left Side Lighting Bar (Pure Emerald, Zero Yellow) -->
  <rect x="2" y="14" width="4.5" height="108" rx="2.25" fill="url(#side-light-fc)"/>

  <!-- Left Column: Exact Official Animated Logo + Domain Pill (No Box Enclosure) -->
  <g transform="translate(18, 14) scale(0.46)">
    <!-- Scaled Mark Container in perfect balanced ratio (scale 1.40x) -->
    <g transform="translate(48, 48) scale(1.40) translate(-48, -48)">
      <!-- Directional Sonar Wave Arcs -->
      <path d="M 64 34 A 22 22 0 0 1 70 48 A 22 22 0 0 1 64 62" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" class="sonar-1"/>
      <path d="M 64 34 A 22 22 0 0 1 70 48 A 22 22 0 0 1 64 62" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" class="sonar-2"/>
      <path d="M 64 34 A 22 22 0 0 1 70 48 A 22 22 0 0 1 64 62" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" class="sonar-3"/>

      <!-- Central Luminous Aperture Geometry with Specular Beacon -->
      <g transform="translate(48, 48) scale(2.4) translate(-16.5, -16.5)">
        <path d="M8 8 C12.5 3.5 20.5 3.5 25 8 C29.5 12.5 29.5 20.5 25 25 C20.5 29.5 12.5 29.5 8 25" stroke="url(#fcOuterGrad)" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M11 11 C14 8 19 8 22 11 C25 14 25 19 22 22" stroke="url(#fcInnerGrad)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="16.5" cy="16.5" r="5.5" fill="url(#fcBeaconGlow)" class="fc-beacon-glow"/>
        <circle cx="16.5" cy="16.5" r="3" fill="url(#fcBeaconGrad)"/>
        <circle cx="15.4" cy="15.3" r="0.75" fill="#FFFFFF" opacity="0.85"/>
      </g>
    </g>

    <!-- Wordmark "FieldCast" -->
    <text x="118" y="75" class="fc-wordmark">
      <tspan class="fc-field">Field</tspan><tspan class="fc-cast">Cast</tspan>
    </text>
  </g>

  <!-- Domain Pill Underneath Logo (Mathematically Centered at x=129) -->
  <rect x="19" y="80" width="220" height="22" rx="5" fill="#0b1720" stroke="#163447" stroke-width="1"/>
  <text x="129" y="94.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.4">AGROMET DOWNSCALING · MOES RES</text>

  <!-- Divider 1 -->
  <line x1="258" y1="18" x2="258" y2="118" stroke="#1c273c" stroke-width="1"/>

  <!-- Center Column: Centered Heading, Large Readable Typography & Telemetry -->
  <g transform="translate(278, 16)">
    <!-- Centered Larger Heading (Zero zoom required) -->
    <text x="218" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.2px">
      Agro-meteorological downscaling engine for weather risk
    </text>
    
    <!-- Centered Subtitle -->
    <text x="218" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Calibrated quantile uncertainty estimation · Actionable decision-support
    </text>

    <!-- Sleek Architectural Dataflow Pipeline (Enlarged & Generous Arrow Gaps) -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="436" height="34" rx="7" fill="#090e1a" stroke="#1c273c" stroke-width="1.2"/>
      
      <!-- Live Status Beacon -->
      <circle cx="16" cy="17" r="4" fill="#10b981" class="fc-pulse-dot"/>
      
      <!-- Model Spec -->
      <text x="30" y="21.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">MODEL <tspan fill="#f8fafc" font-weight="700">LightGBM (UQ)</tspan></text>
      
      <!-- Directional Chevron (Centered with generous 32px clearance) -->
      <text x="210" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">──▶</text>
      
      <!-- Geo Engine Spec -->
      <text x="250" y="21.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">GEO <tspan fill="#34d399" font-weight="700">MapLibre GL Vector</tspan></text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="728" y1="18" x2="728" y2="118" stroke="#1c273c" stroke-width="1"/>

  <!-- Right Column: Clean Tech Stack Matrix (Vertically Centered) -->
  <g transform="translate(746, 36)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="82" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="41" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Python</text>

    <rect x="90" y="0" width="86" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="133" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">LightGBM</text>

    <!-- Row 2 -->
    <rect x="0" y="34" width="82" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="41" y="50.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">MapLibre</text>

    <rect x="90" y="34" width="86" height="26" rx="6" fill="#0d1424" stroke="#1e2c45"/>
    <text x="133" y="50.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">GeoPandas</text>
  </g>

  <!-- Luminous Shimmer Light Sweep -->
  <g clip-path="url(#clip-fc)" pointer-events="none">
    <rect class="shimmer-layer" x="0" y="0" width="220" height="136" fill="url(#shimmer-fc)"/>
  </g>
</svg>
