name: Auto-Sync Profile Views

on:
  schedule:
    # Run every 3 hours to automatically sync view count
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-views:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch view count & update badge SVG
        run: |
          RAW_SVG=$(curl -s "https://hits.sh/github.com/SumanthMamidi-MNS.svg?extraCount=615")
          COUNT=$(echo "$RAW_SVG" | grep -oPm1 "(?<=<text)[^>]*>[0-9]+" | grep -oPm1 "[0-9]+")
          echo "Discovered count: $COUNT"
          if [ -n "$COUNT" ] && [ "$COUNT" -ge 600 ]; then
            sed -i -E "s/>[0-9]+<\/text>/>$COUNT<\/text>/g" assets/badge_profile_views.svg
            sed -i -E "s/VIEWS: [0-9]+/VIEWS: $COUNT/g" assets/badge_profile_views.svg
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badge_profile_views.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): auto-sync profile views count" && git push)
