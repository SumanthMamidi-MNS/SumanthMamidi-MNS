name: Generate Snake

on:
  schedule:
    # Run every 6 hours to keep contribution dots fresh
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-contribution-grid-snake*.svg"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates a game of snake from a github user contributions graph, output a svg animation at <svg_out_path>
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=%2373daca&color_dots=%231a1b26,%232e3047,%23434975,%237aa2f7,%237dcfff
            assets/github-contribution-grid-snake-dark.svg?color_snake=%2373daca&color_dots=%2316161e,%232e3047,%23434975,%237aa2f7,%237dcfff
          
      # Commit and push directly to main branch attributed to Sumanth
      - name: Push to main branch
        run: |
          git config --global user.name "Sumanth"
          git config --global user.email "mamidinagasaisumanth@gmail.com"
          git add assets/github-contribution-grid-snake*.svg
          if git diff --staged --quiet; then
            echo "No snake changes to commit"
          else
            git commit -m "chore(snake): auto-update contribution snake animation [skip ci]"
            git push origin main
          fi
