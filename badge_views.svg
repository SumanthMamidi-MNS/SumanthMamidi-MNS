<svg xmlns="http://www.w3.org/2000/svg" width="186" height="32" viewBox="0 0 186 32" fill="none">
  <defs>
    <linearGradient id="views-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#111928"/>
    </linearGradient>
    <linearGradient id="views-pill-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="1" y="1" width="184" height="30" rx="6" fill="url(#views-bg)" stroke="#1e2c45" stroke-width="1.2"/>

  <!-- Left Icon: Eye Glyphs -->
  <g transform="translate(14, 9)">
    <path d="M1 7 C3.5 2.5 8.5 2.5 11 7 C8.5 11.5 3.5 11.5 1 7 Z" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="6" cy="7" r="2.2" fill="#38bdf8"/>
  </g>

  <!-- Label: PROFILE VIEWS -->
  <text x="36" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">PROFILE VIEWS</text>

  <!-- Value Pill Background -->
  <rect x="136" y="4" width="44" height="24" rx="4" fill="#162235" stroke="#1e3a5f" stroke-width="1"/>
  
  <!-- Counter Value: 640 -->
  <text x="158" y="20.5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8" text-anchor="middle">640</text>
</svg>
