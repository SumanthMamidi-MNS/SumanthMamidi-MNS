<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40" fill="none">
  <defs>
    <!-- Sleek Underline Gradient -->
    <linearGradient id="line-telemetry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Centered Space Grotesk Title (Bigger font, compact height) -->
  <text x="400" y="22" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    ◈ ENGINEERING TELEMETRY &amp; STATS ◈
  </text>

  <!-- Single Elegant Anchor Line Just Under the Heading -->
  <line x1="230" y1="33" x2="570" y2="33" stroke="url(#line-telemetry)" stroke-width="2" stroke-linecap="round"/>
</svg>
