  <text x="400" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
