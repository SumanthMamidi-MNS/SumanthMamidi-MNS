  <!-- Centered Space Grotesk Heading (Large, High Contrast) -->
  <text x="470" y="32" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ◈ FLAGSHIP AI SYSTEMS &amp; ARCHITECTURES ◈
  </text>

  <!-- Right Accent Line & Node -->
  <circle cx="710" cy="24" r="3.5" fill="#facc15"/>
