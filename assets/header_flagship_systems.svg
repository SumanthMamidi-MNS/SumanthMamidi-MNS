      <stop offset="0%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="line-right-fs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.8"/>
