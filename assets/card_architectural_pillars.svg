<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101d"/>
      <stop offset="50%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#0c101d"/>
    </linearGradient>
    <linearGradient id="p-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #38bdf8; }
    .badge-rect { fill: #facc15; fill-opacity: 0.12; stroke: #facc15; stroke-opacity: 0.4; stroke-width: 1px; rx: 4px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #facc15; letter-spacing: 0.8px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }
    .tag-bg { fill: #1e293b; rx: 4px; }
    .divider { stroke: #21262d; stroke-width: 1px; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="211" rx="10" fill="url(#p-bg)" stroke="url(#p-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="211" rx="10" fill="url(#glow-left)"/>
  <rect x="2" y="2" width="896" height="211" rx="10" fill="url(#glow-right)"/>

  <!-- Column 1: Neural & Agent Systems -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" class="title">🧠 Neural &amp; Agent Systems</text>
    <rect x="0" y="12" width="160" height="18" class="badge-rect"/>
    <text x="7" y="25" class="badge-text">MULTI-AGENT INTELLIGENCE</text>
    <text x="0" y="54" class="desc">
      <tspan x="0" dy="0">Architecting autonomous multi-agent</tspan>
      <tspan x="0" dy="18">pipelines, LLM benchmark testbeds,</tspan>
      <tspan x="0" dy="18">prompt defense &amp; RL workflows.</tspan>
    </text>
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="115" height="22" class="tag-bg"/>
      <text x="8" y="15" class="tag">Autonomous Agents</text>
      <rect x="123" y="0" width="110" height="22" class="tag-bg"/>
      <text x="131" y="15" class="tag">LLM Benchmarks</text>
    </g>
  </g>

  <!-- Divider 1 -->
  <line x1="305" y1="20" x2="305" y2="195" class="divider"/>

  <!-- Column 2: Scalable AI Infrastructure -->
  <g transform="translate(335, 24)">
    <text x="0" y="0" class="title">⚡ Scalable AI Infrastructure</text>
    <rect x="0" y="12" width="155" height="18" class="badge-rect"/>
    <text x="7" y="25" class="badge-text">HIGH-THROUGHPUT SYSTEMS</text>
    <text x="0" y="54" class="desc">
      <tspan x="0" dy="0">Engineering high-throughput inference</tspan>
      <tspan x="0" dy="18">APIs with FastAPI, Docker container</tspan>
      <tspan x="0" dy="18">pipelines &amp; cloud orchestration.</tspan>
    </text>
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="90" height="22" class="tag-bg"/>
      <text x="8" y="15" class="tag">Async FastAPI</text>
      <rect x="98" y="0" width="125" height="22" class="tag-bg"/>
      <text x="106" y="15" class="tag">Docker Pipelines</text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="605" y1="20" x2="605" y2="195" class="divider"/>

  <!-- Column 3: Vision & Spatial Computing -->
  <g transform="translate(635, 24)">
    <text x="0" y="0" class="title">👁️ Vision &amp; Spatial Computing</text>
    <rect x="0" y="12" width="140" height="18" class="badge-rect"/>
    <text x="7" y="25" class="badge-text">SPATIAL &amp; 3D VISION</text>
    <text x="0" y="54" class="desc">
      <tspan x="0" dy="0">Developing real-time vision pipelines,</tspan>
      <tspan x="0" dy="18">webcam hand-gesture tracking with</tspan>
      <tspan x="0" dy="18">MediaPipe &amp; 3D Three.js graphics.</tspan>
    </text>
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="105" height="22" class="tag-bg"/>
      <text x="8" y="15" class="tag">MediaPipe Vision</text>
      <rect x="113" y="0" width="100" height="22" class="tag-bg"/>
      <text x="121" y="15" class="tag">Three.js 3D</text>
    </g>
  </g>
</svg>