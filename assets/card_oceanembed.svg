<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 148" width="100%">
  <defs>
    <linearGradient id="card-bg-oe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="side-light-oe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="35%" stop-color="#45c4d6"/>
      <stop offset="70%" stop-color="#0a5a78"/>
      <stop offset="100%" stop-color="#06445c"/>
    </linearGradient>
    <radialGradient id="left-glow-oe" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#45c4d6" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0a5a78" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer-oe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45c4d6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#45c4d6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-oe">
      <rect x="2" y="2" width="936" height="144" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes shimmer-sweep {
      0% { transform: translateX(-400px) skewX(-20deg); }
      35% { transform: translateX(1200px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    .shimmer-layer {
      animation: shimmer-sweep 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
      animation-delay: 4.5s;
      pointer-events: none;
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="2" y="2" width="936" height="144" rx="12" fill="url(#card-bg-oe)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="220" height="144" rx="12" fill="url(#left-glow-oe)" pointer-events="none"/>

  <!-- Left Side Lighting Bar (Variation 2 Accent) -->
  <rect x="2" y="14" width="4.5" height="120" rx="2.25" fill="url(#side-light-oe)"/>

  <!-- Index Number 04 (Variation 5 Editorial Accent) -->
  <text x="22" y="44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1b2438" letter-spacing="-1">04</text>

  <!-- Left Column: Official Logo + Domain Pill -->
  <g transform="translate(76, 22)">
    <!-- Oceanic Strata Mark -->
    <rect x="8" y="10" width="44" height="44" rx="10" fill="#0f172a" stroke="url(#side-light-oe)" stroke-width="2.5"/>
    <path d="M16 22 Q 30 18, 44 22" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 32 Q 30 28, 44 32" fill="none" stroke="#45c4d6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 42 Q 30 38, 44 42" fill="none" stroke="#0a5a78" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Title Text Lockup -->
    <text x="60" y="32" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Ocean<tspan fill="#45c4d6">Embed</tspan></text>
    <rect x="60" y="42" width="186" height="18" rx="4" fill="#141d2d" stroke="#223049" stroke-width="1"/>
    <text x="153" y="54.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#45c4d6" text-anchor="middle">SATELLITE TRANSFORMERS · 3D</text>
  </g>

  <!-- Divider 1 -->
  <line x1="334" y1="20" x2="334" y2="128" stroke="#1c273c" stroke-width="1"/>

  <!-- Center Column: Recruiter-Oriented Technical Info (Variation 2 Telemetry) -->
  <g transform="translate(354, 30)">
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">
      <tspan x="0" dy="0">Deep-learning subsurface ocean temp reconstruction (15 depths, 0–1000m).</tspan>
      <tspan x="0" dy="21" fill="#94a3b8" font-size="12.5">Reconstructs 3D fields from satellite surface data; validated vs GLORYS/Argo.</tspan>
    </text>

    <!-- Technical Specs & Pipeline Matrix -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="186" height="22" rx="4" fill="#060911" stroke="#1a2538"/>
      <text x="8" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94a3b8">BACKBONE: <tspan fill="#45c4d6" font-weight="700">Spatial Transformer</tspan></text>

      <rect x="194" y="0" width="158" height="22" rx="4" fill="#060911" stroke="#1a2538"/>
      <text x="202" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94a3b8">VALIDATION: <tspan fill="#34d399" font-weight="700">GLORYS / Argo</tspan></text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="724" y1="20" x2="724" y2="128" stroke="#1c273c" stroke-width="1"/>

  <!-- Right Column: Upgraded Tech Chips + CTA -->
  <g transform="translate(744, 28)">
    <rect x="0" y="0" width="78" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="39" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">PyTorch</text>

    <rect x="86" y="0" width="84" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="128" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">FastAPI</text>

    <rect x="0" y="32" width="78" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="39" y="47.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">React</text>

    <rect x="86" y="32" width="84" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="128" y="47.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Attention</text>

    <!-- View Repo Action -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="170" height="22" rx="4" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)"/>
      <text x="85" y="14.5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">View Repository ↗</text>
    </g>
  </g>

  <!-- Luminous Shimmer Light Sweep -->
  <g clip-path="url(#clip-oe)" pointer-events="none">
    <rect class="shimmer-layer" x="0" y="0" width="220" height="148" fill="url(#shimmer-oe)"/>
  </g>
</svg>
