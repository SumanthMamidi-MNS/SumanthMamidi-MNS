<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 148" width="100%">
  <defs>
    <linearGradient id="card-bg-tc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="side-light-tc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="left-glow-tc" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer-tc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-tc">
      <rect x="2" y="2" width="936" height="144" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes shimmer-sweep {
      0% { transform: translateX(-400px) skewX(-20deg); }
      35% { transform: translateX(1200px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    .shimmer-layer {
      animation: shimmer-sweep 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
      animation-delay: 0s;
      pointer-events: none;
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="2" y="2" width="936" height="144" rx="12" fill="url(#card-bg-tc)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="220" height="144" rx="12" fill="url(#left-glow-tc)" pointer-events="none"/>

  <!-- Left Side Lighting Bar (Variation 2 Accent) -->
  <rect x="2" y="14" width="4.5" height="120" rx="2.25" fill="url(#side-light-tc)"/>

  <!-- Index Number 01 (Variation 5 Editorial Accent) -->
  <text x="22" y="44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1b2438" letter-spacing="-1">01</text>

  <!-- Left Column: Official Logo + Domain Pill -->
  <!-- Official Shield Logo Mark -->
  <g transform="translate(76, 22)">
    <!-- Shield -->
    <path d="M28 4 L48 14 V38 C48 52 28 60 28 60 C28 60 8 52 8 38 V14 Z"
          fill="#0f172a"
          stroke="url(#side-light-tc)"
          stroke-width="3"
          stroke-linejoin="round"/>
    <!-- Checkmark -->
    <path d="M20 33 L26 39 L38 24"
          fill="none"
          stroke="#34d399"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Title Text Lockup -->
    <text x="60" y="32" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#ffffff">True<tspan fill="#facc15">Cite</tspan></text>
    <rect x="60" y="42" width="186" height="18" rx="4" fill="#141d2d" stroke="#223049" stroke-width="1"/>
    <text x="153" y="54.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#facc15" text-anchor="middle">CITATION-VERIFIED RAG · LEGAL</text>
  </g>

  <!-- Divider 1 -->
  <line x1="334" y1="20" x2="334" y2="128" stroke="#1c273c" stroke-width="1"/>

  <!-- Center Column: Recruiter-Oriented Technical Info (Variation 2 Telemetry) -->
  <g transform="translate(354, 30)">
    <!-- Core Description -->
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">
      <tspan x="0" dy="0">Citation-verified RAG assistant for Ayurveda IP &amp; regulatory guidance.</tspan>
      <tspan x="0" dy="21" fill="#94a3b8" font-size="12.5">Every citation is checked against ground truth before synthesis &amp; display.</tspan>
    </text>

    <!-- Technical Specs & Pipeline Matrix -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="168" height="22" rx="4" fill="#060911" stroke="#1a2538"/>
      <text x="8" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94a3b8">PIPELINE: <tspan fill="#38bdf8" font-weight="700">Dense + BM25</tspan></text>

      <rect x="176" y="0" width="176" height="22" rx="4" fill="#060911" stroke="#1a2538"/>
      <text x="184" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94a3b8">GROUNDING: <tspan fill="#22c55e" font-weight="700">100% Attribution</tspan></text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="724" y1="20" x2="724" y2="128" stroke="#1c273c" stroke-width="1"/>

  <!-- Right Column: Upgraded Tech Chips + CTA -->
  <g transform="translate(744, 28)">
    <rect x="0" y="0" width="78" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="39" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Python</text>

    <rect x="86" y="0" width="84" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="128" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">FastAPI</text>

    <rect x="0" y="32" width="78" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="39" y="47.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">PyTorch</text>

    <rect x="86" y="32" width="84" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="128" y="47.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">ChromaDB</text>

    <!-- View Repo Action -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="170" height="22" rx="4" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)"/>
      <text x="85" y="14.5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">View Repository ↗</text>
    </g>
  </g>

  <!-- Luminous Shimmer Light Sweep -->
  <g clip-path="url(#clip-tc)" pointer-events="none">
    <rect class="shimmer-layer" x="0" y="0" width="220" height="148" fill="url(#shimmer-tc)"/>
  </g>
</svg>
