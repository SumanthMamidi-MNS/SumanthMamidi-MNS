<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 148" width="100%">
  <defs>
    <linearGradient id="card-bg-ut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="side-light-ut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="35%" stop-color="#6fdcec"/>
      <stop offset="70%" stop-color="#3cc4d8"/>
      <stop offset="100%" stop-color="#1d6f7c"/>
    </linearGradient>
    <radialGradient id="left-glow-ut" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3cc4d8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#1d6f7c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer-ut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3cc4d8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3cc4d8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-ut">
      <rect x="2" y="2" width="936" height="144" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes shimmer-sweep {
      0% { transform: translateX(-400px) skewX(-20deg); }
      35% { transform: translateX(1200px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    .shimmer-layer {
      animation: shimmer-sweep 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
      animation-delay: 1.5s;
      pointer-events: none;
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="2" y="2" width="936" height="144" rx="12" fill="url(#card-bg-ut)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="2" y="2" width="220" height="144" rx="12" fill="url(#left-glow-ut)" pointer-events="none"/>

  <!-- Left Side Lighting Bar (Variation 2 Accent) -->
  <rect x="2" y="14" width="4.5" height="120" rx="2.25" fill="url(#side-light-ut)"/>

  <!-- Index Number 02 (Variation 5 Editorial Accent) -->
  <text x="22" y="44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1b2438" letter-spacing="-1">02</text>

  <!-- Left Column: Official Logo + Domain Pill -->
  <g transform="translate(76, 22)">
    <!-- Signal Target Mark -->
    <rect x="8" y="10" width="44" height="44" rx="10" fill="#0f172a" stroke="url(#side-light-ut)" stroke-width="2.5"/>
    <circle cx="30" cy="32" r="10" fill="none" stroke="#3cc4d8" stroke-width="2"/>
    <circle cx="30" cy="32" r="4" fill="#a5f3fc"/>
    <!-- Sonar ray -->
    <path d="M22 24 L38 40" stroke="#3cc4d8" stroke-width="2" stroke-linecap="round"/>

    <!-- Title Text Lockup -->
    <text x="60" y="32" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Urban<tspan fill="#38bdf8">Trace</tspan></text>
    <rect x="60" y="42" width="186" height="18" rx="4" fill="#141d2d" stroke="#223049" stroke-width="1"/>
    <text x="153" y="54.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">CITY ANPR · VEHICLE RE-ID</text>
  </g>

  <!-- Divider 1 -->
  <line x1="334" y1="20" x2="334" y2="128" stroke="#1c273c" stroke-width="1"/>

  <!-- Center Column: Recruiter-Oriented Technical Info (Variation 2 Telemetry) -->
  <g transform="translate(354, 30)">
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">
      <tspan x="0" dy="0">City-wide ANPR network engine fusing noisy plate reads &amp; appearance.</tspan>
      <tspan x="0" dy="21" fill="#94a3b8" font-size="12.5">Reconstructs full vehicle journeys, spatiotemporal graphs &amp; real-time alerts.</tspan>
    </text>

    <!-- Technical Specs & Pipeline Matrix -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="154" height="22" rx="4" fill="#060911" stroke="#1a2538"/>
      <text x="8" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94a3b8">DETECTION: <tspan fill="#38bdf8" font-weight="700">YOLOv8</tspan></text>

      <rect x="162" y="0" width="190" height="22" rx="4" fill="#060911" stroke="#1a2538"/>
      <text x="170" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94a3b8">TRACKING: <tspan fill="#22c55e" font-weight="700">DeepSORT Multi-Cam</tspan></text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="724" y1="20" x2="724" y2="128" stroke="#1c273c" stroke-width="1"/>

  <!-- Right Column: Upgraded Tech Chips + CTA -->
  <g transform="translate(744, 28)">
    <rect x="0" y="0" width="78" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="39" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Python</text>

    <rect x="86" y="0" width="84" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="128" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">YOLOv8</text>

    <rect x="0" y="32" width="78" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="39" y="47.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">DeepSORT</text>

    <rect x="86" y="32" width="84" height="24" rx="5" fill="#111a2c" stroke="#1e2c45"/>
    <text x="128" y="47.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">OpenCV</text>

    <!-- View Repo Action -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="170" height="22" rx="4" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)"/>
      <text x="85" y="14.5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">View Repository ↗</text>
    </g>
  </g>

  <!-- Luminous Shimmer Light Sweep -->
  <g clip-path="url(#clip-ut)" pointer-events="none">
    <rect class="shimmer-layer" x="0" y="0" width="220" height="148" fill="url(#shimmer-ut)"/>
  </g>
</svg>
