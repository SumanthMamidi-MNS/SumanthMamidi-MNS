<svg xmlns="http://www.w3.org/2000/svg" width="118" height="28" role="img" aria-label="Portfolio">
  <title>Portfolio</title>
  <defs>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <g shape-rendering="crispEdges">
    <rect width="118" height="28" fill="#161b22" rx="4"/>
  </g>
  <!-- Stylized Vercel Delta Prism Logo with Luminous Accent -->
  <g transform="translate(10, 6)">
    <!-- Base Delta Triangle -->
    <path d="M8 2 L15.5 15 L0.5 15 Z" fill="url(#prism-grad)"/>
    <!-- Subtle Inner Geometry Shadow -->
    <path d="M8 2 L15.5 15 L8 12 Z" fill="#0284c7" opacity="0.45"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-rendering="geometricPrecision">
    <text x="68" y="18" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.7">PORTFOLIO</text>
  </g>
</svg>
