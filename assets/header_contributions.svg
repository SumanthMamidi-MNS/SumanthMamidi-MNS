<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 32" width="100%" height="32" fill="none">
  <defs>
    <!-- Sleek Underline Gradient -->
    <linearGradient id="line-contributions" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Centered Space Grotesk Title (Refined 15px Executive Size) -->
  <text x="400" y="18" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.8">
    ◈ CONTRIBUTION ACTIVITY ◈
  </text>

  <!-- Elegant Anchor Line Underneath -->
  <line x1="270" y1="26" x2="530" y2="26" stroke="url(#line-contributions)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
