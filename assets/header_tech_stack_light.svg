<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 46" width="100%" height="46" fill="none">
  <defs>
    <style>
      .hdr-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17.5px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: middle;
        fill: #1f2328;
      }
      .base-line {
        stroke: #d0d7de;
        stroke-width: 1.5;
      }
    </style>
    <linearGradient id="line-tech-stack-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="400" y="22" class="hdr-text">
    <tspan fill="#3b82f6">◈</tspan> TECHNICAL SKILLS &amp; STACK <tspan fill="#3b82f6">◈</tspan>
  </text>

  <!-- Full-Width Solid Border Line (Light Mode) -->
  <line x1="0" y1="38" x2="800" y2="38" class="base-line"/>
  <line x1="100" y1="38" x2="700" y2="38" stroke="url(#line-tech-stack-light)" stroke-width="1.8"/>
</svg>
