<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="440" height="195">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101d"/>
      <stop offset="100%" stop-color="#121726"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="top-glow" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="436" height="191" rx="10" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="436" height="191" rx="10" fill="url(#top-glow)"/>

  <!-- Header -->
  <g transform="translate(24, 26)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#38bdf8">✉️ EmailEnv</text>
    <rect x="0" y="12" width="152.6" height="17" rx="3" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.4" stroke-width="1"/>
    <text x="7" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#facc15" letter-spacing="0.6px">AGENT FLIGHT SIMULATOR</text>
    
    <!-- Description -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
      <tspan x="0" dy="0">OpenEnv-compliant evaluation harness &amp; simulated flight deck</tspan>
      <tspan x="0" dy="18">for email agents with multi-tier LLM benchmark suites,</tspan>
      <tspan x="0" dy="18">prompt injection defense, and safety filters.</tspan>
    </text>

    <!-- Tags -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="61.0" height="22" rx="4" fill="#1e293b"/>
<text x="8" y="15" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#e2e8f0">Python</text>\n<rect x="69.0" y="0" width="113.5" height="22" rx="4" fill="#1e293b"/>
<text x="77.0" y="15" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#e2e8f0">LLM Benchmark</text>\n<rect x="190.5" y="0" width="83.5" height="22" rx="4" fill="#1e293b"/>
<text x="198.5" y="15" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#e2e8f0">AI Safety</text>\n<rect x="282.0" y="0" width="61.0" height="22" rx="4" fill="#1e293b"/>
<text x="290.0" y="15" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#e2e8f0">Agents</text>
    </g>
  </g>
</svg>