<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 118" width="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101d"/>
      <stop offset="60%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#0c101d"/>
    </linearGradient>
    <linearGradient id="border-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1f293d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="8%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="2" y="2" width="896" height="114" rx="10"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulse-dot {
      0% { r: 3.5px; opacity: 1; }
      50% { r: 5px; opacity: 0.4; }
      100% { r: 3.5px; opacity: 1; }
    }
    .pulse-circle {
      animation: pulse-dot 2.5s infinite ease-in-out;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 19px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .badge-rect {
      fill: #facc15;
      fill-opacity: 0.12;
      stroke: #facc15;
      stroke-opacity: 0.4;
      stroke-width: 1px;
      rx: 3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      fill: #facc15;
      letter-spacing: 0.6px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      fill: #94a3b8;
      line-height: 1.5;
    }
    .tag-box {
      fill: #1e293b;
      rx: 4px;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      fill: #e2e8f0;
      dominant-baseline: middle;
    }
    .divider-line {
      stroke: #21262d;
      stroke-width: 1px;
    }
    .status-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      font-weight: 600;
      fill: #22c55e;
      letter-spacing: 0.5px;
      dominant-baseline: middle;
    }
    @keyframes shimmer-sweep {
      0% {
        transform: translateX(-420px) skewX(-20deg);
      }
      32% {
        transform: translateX(1150px) skewX(-20deg);
      }
      100% {
        transform: translateX(1150px) skewX(-20deg);
      }
    }
    .shimmer-bar {
      animation: shimmer-sweep 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      animation-delay: 1.25s;
      pointer-events: none;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="114" rx="10" fill="url(#card-bg)" stroke="url(#border-stream)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="114" rx="10" fill="url(#card-glow)"/>

  <!-- Left: Title, Badge & Live Pulse Status -->
  <g transform="translate(24, 24)">
    <circle cx="4" cy="4" r="3.5" fill="#22c55e" class="pulse-circle"/>
    <text x="14" y="5" class="status-text">ACTIVE REPOSITORY</text>
    <text x="0" y="32" class="title-text">✉️ EmailEnv</text>
    <rect x="0" y="44" width="157.0" height="18" class="badge-rect"/>
    <text x="78.5" y="54" class="badge-text">AGENT FLIGHT SIMULATOR</text>
  </g>

  <!-- Divider 1 -->
  <line x1="245" y1="18" x2="245" y2="100" class="divider-line"/>

  <!-- Center: High-Contrast Description -->
  <g transform="translate(265, 42)">
    <text x="0" y="0" class="desc-text">
      <tspan x="0" dy="0">OpenEnv-compliant evaluation harness and simulated flight deck</tspan>
      <tspan x="0" dy="21">for email agents with multi-tier LLM safety benchmarks.</tspan>
    </text>
  </g>

  <!-- Divider 2 -->
  <line x1="640" y1="18" x2="640" y2="100" class="divider-line"/>

  <!-- Right: 4 Monospace Tech Pills -->
  <g transform="translate(658, 28)">
    <rect x="0" y="0" width="57.2" height="22" class="tag-box"/>
    <text x="7" y="11" class="tag-text">Python</text>
    
    <rect x="65.2" y="0" width="107.60000000000001" height="22" class="tag-box"/>
    <text x="72.2" y="11" class="tag-text">LLM Benchmark</text>

    <rect x="0" y="32" width="78.8" height="22" class="tag-box"/>
    <text x="7" y="43" class="tag-text">AI Safety</text>

    <rect x="86.8" y="32" width="57.2" height="22" class="tag-box"/>
    <text x="93.8" y="43" class="tag-text">Agents</text>
  </g>

  <!-- Luminous Shimmer Light Sweep Overlay (Traverses across entire card) -->
  <g clip-path="url(#card-clip)" pointer-events="none">
    <rect class="shimmer-bar" x="0" y="-20" width="240" height="160" fill="url(#shimmer-grad)"/>
  </g>
</svg>