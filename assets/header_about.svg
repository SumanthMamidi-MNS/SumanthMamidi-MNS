<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="100%" height="48" fill="none">
  <defs>
    <linearGradient id="line-left-ab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="line-right-ab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Left Accent Line & Node -->
  <line x1="140" y1="24" x2="270" y2="24" stroke="url(#line-left-ab)" stroke-width="1.8"/>
  <circle cx="270" cy="24" r="3.5" fill="#38bdf8"/>

  <!-- Centered Space Grotesk Heading (Large, High Contrast) -->
  <text x="400" y="32" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ◈ ABOUT ME ◈
  </text>

  <!-- Right Accent Line & Node -->
  <circle cx="530" cy="24" r="3.5" fill="#38bdf8"/>
  <line x1="530" y1="24" x2="660" y2="24" stroke="url(#line-right-ab)" stroke-width="1.8"/>
</svg>
